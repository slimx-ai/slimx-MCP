[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slimx-mcp"
version = "0.1.1"
description = "SlimX-MCP: the bounded MCP transport gateway for the SlimX platform (SSRF-guarded JSON-RPC over HTTP, size/time caps, service mode)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SlimX AI" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    # Pinned: ruff's default rule set grows between releases, which turned main red unnoticed.
    "ruff==0.16.8",
]

[tool.setuptools.packages.find]
include = ["slimx_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
# The package re-exports its public names as ``name as name``; keep them in one statement.
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
